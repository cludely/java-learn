# Spring Boot 会在应用启动时自动加载名为 application.properties 的默认配置文件。
# 本文件位于 src/main/resources；Maven 构建后会被复制到 classpath 根目录，
# 因此无需在 Java 代码中手动读取或额外声明加载路径。
#
# 外部配置的优先级通常更高：可在启动目录或其 config 子目录放置同名配置文件，
# 也可通过命令行传入，例如：--spring.application.name=my-app。
#
# 环境差异配置可放入 application-dev.properties，并通过
# spring.profiles.active=dev 启用对应的 Profile。
#
# 如果同一位置同时存在 application.yml 和 application.properties，Spring Boot 会同时加载二者。
# 配置键相同时，application.properties 的优先级更高，会覆盖 application.yml 中的值；
# 只在其中一个文件定义的配置仍会合并生效。为避免配置来源分散，实际项目通常只选择一种格式。

# 应用名称：会用于日志、Actuator 等 Spring Boot 功能的应用标识。
spring.application.name=springboot-001

