<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring MVC First</title>
</head>
<body>
    <h1>Hello, First</h1>

    <!-- 这种写法，会在请求路径前面自动添加项目的根路径 -->
    <!-- 最终会解析为 href="/springmvc/other" -->
    <a th:href="@{/other}">other request</a>
</body>
</html>
